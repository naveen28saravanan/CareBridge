name: 🛡️ CareBridge Security Scan Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # PHASE 1 & 2: Backend Discovery + API Audit
  # ─────────────────────────────────────────────
  backend-discovery:
    name: 🔍 Phase 1 & 2 — Backend Discovery & API Inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Backend Inventory Report
        run: node scripts/security-report.mjs discovery

      - name: Upload Discovery Report
        uses: actions/upload-artifact@v4
        with:
          name: phase1-2-backend-discovery
          path: security-reports/phase1-2-discovery.md

  # ─────────────────────────────────────────────
  # PHASE 3: SAST — Static Analysis
  # ─────────────────────────────────────────────
  sast:
    name: 🔬 Phase 3 — SAST Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (zero errors required)
        run: npm run check

      - name: Unit & integration test suite
        run: npm test

      - name: UI interaction audit
        run: npm run audit:buttons

      - name: Secrets scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Semgrep SAST scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/security-audit
        continue-on-error: true

      - name: Generate SAST report
        run: node scripts/security-report.mjs sast

      - name: Upload SAST Report
        uses: actions/upload-artifact@v4
        with:
          name: phase3-sast-report
          path: security-reports/phase3-sast.md

  # ─────────────────────────────────────────────
  # PHASE 4: Authenticated API Behaviour Tests
  # ─────────────────────────────────────────────
  api-tests:
    name: 🌐 Phase 4 — API Security Behaviour Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start backend API server
        run: |
          node server/index.mjs &
          sleep 3
        env:
          NODE_ENV: test

      - name: Run API security behaviour tests
        run: node scripts/security-report.mjs api
        env:
          TEST_API_URL: http://localhost:8787

      - name: Upload API Test Report
        uses: actions/upload-artifact@v4
        with:
          name: phase4-api-security-report
          path: security-reports/phase4-api.md

  # ─────────────────────────────────────────────
  # PHASE 5: Dependency Vulnerability Scanning
  # ─────────────────────────────────────────────
  dependency-scan:
    name: 📦 Phase 5 — Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (dependency CVE scan)
        run: npm audit --json > security-reports/npm-audit.json || true

      - name: npm audit human-readable summary
        run: npm audit || true

      - name: Scan container & filesystem with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy JSON report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: security-reports/trivy-report.json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM

      - name: Generate dependency scan summary
        run: node scripts/security-report.mjs deps

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: phase5-dependency-scan
          path: |
            security-reports/npm-audit.json
            security-reports/trivy-report.json
            security-reports/phase5-deps.md

  # ─────────────────────────────────────────────
  # FINAL: Consolidated Security Summary
  # ─────────────────────────────────────────────
  security-summary:
    name: 📊 Security Assessment Summary
    runs-on: ubuntu-latest
    needs: [backend-discovery, sast, api-tests, dependency-scan]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all phase reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports/

      - name: Generate final consolidated report
        run: node scripts/security-report.mjs summary

      - name: Publish GitHub Actions summary
        run: |
          echo "# 🛡️ CareBridge Security Assessment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Area | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 1 & 2 | Backend Discovery & API Inventory | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 3 | SAST — TypeScript, Semgrep, Gitleaks | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 4 | API Security Behaviour Tests | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 5 | Dependency CVE Scan (npm audit + Trivy) | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download full reports from the Artifacts section above.**" >> $GITHUB_STEP_SUMMARY

      - name: Upload consolidated final report
        uses: actions/upload-artifact@v4
        with:
          name: 🛡️-carebridge-full-security-report
          path: security-reports/
          retention-days: 30
