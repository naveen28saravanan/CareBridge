name: CareBridge Comprehensive Security Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security_review:
    name: Full Security Assessment (SAST + DAST + Deps + Reports)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create Report Directories
        run: |
          mkdir -p security-reports
          mkdir -p "Vulnerability Test Results"

      - name: Install Dependencies
        run: npm ci

      # ── PHASE 1+2: Backend Discovery ─────────────────────────────────────
      - name: Phase 1+2 — Backend Discovery & API Inventory
        run: node scripts/security-report.mjs discovery

      # ── PHASE 3: SAST ─────────────────────────────────────────────────────
      - name: Phase 3a — Semgrep SAST Scan
        run: |
          pip3 install semgrep --quiet || true
          semgrep --config=p/owasp-top-ten \
                  --config=p/javascript \
                  --config=p/secrets \
                  --json \
                  --output=security-reports/semgrep-report.json \
                  --no-error \
                  . || true
          echo "✅ Semgrep scan complete"

      - name: Phase 3b — Custom SAST Checks
        run: node scripts/security-report.mjs sast

      # ── PHASE 4: DAST Live API Tests ──────────────────────────────────────
      - name: Start Backend API for DAST Testing
        run: |
          node server/index.mjs &
          sleep 4
          curl -sf http://localhost:8787/api/health && echo "✅ API is ready" || echo "⚠️ API not reachable"

      - name: Phase 4 — DAST API Security Tests
        env:
          TEST_API_URL: "http://localhost:8787"
        run: node scripts/security-report.mjs api

      # ── PHASE 5: Dependency Scanning ──────────────────────────────────────
      - name: Phase 5a — npm Audit (CVE Scan)
        run: |
          npm audit --json > security-reports/npm-audit.json || true
          echo "✅ npm audit complete"

      - name: Phase 5b — Dependency Report
        run: node scripts/security-report.mjs deps

      - name: Phase 5c — Trivy Filesystem Scan (JSON)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: security-reports/trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Phase 5d — Trivy SARIF for GitHub Security Tab
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: security-reports/trivy-results.sarif
          exit-code: '0'

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: security-reports/trivy-results.sarif

      - name: Phase 5e — Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── PHASE 6+7+8: Report Generation ────────────────────────────────────
      - name: Phase 6+7+8 — Generate All Reports (Markdown + Excel)
        run: |
          node scripts/generate-security-reports.mjs
          node scripts/security-report.mjs summary

      # ── GitHub Actions Summary ─────────────────────────────────────────────
      - name: Publish Security Summary
        if: always()
        run: |
          {
            echo "# 🛡️ CareBridge Security Assessment"
            echo ""
            echo "**Run completed:** $(date -u)"
            echo ""
            cat security-reports/FULL_SUMMARY.md || echo "Summary not generated"
            echo ""
            echo "## 📁 Reports Generated"
            echo "- \`Vulnerability Test Results/security-review.md\`"
            echo "- \`Vulnerability Test Results/executive-summary.md\`"
            echo "- \`Vulnerability Test Results/dependency-report.md\`"
            echo "- \`Vulnerability Test Results/findings.xlsx\`"
            echo "- \`security-reports/npm-audit.json\`"
            echo "- \`security-reports/trivy-report.json\`"
            echo "- \`security-reports/semgrep-report.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload Artifacts ───────────────────────────────────────────────────
      - name: Upload All Security Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carebridge-security-reports
          path: |
            Vulnerability Test Results/
            security-reports/

      # ── Fail ONLY on Critical npm CVEs ────────────────────────────────────
      - name: Fail on Critical Vulnerabilities
        run: |
          CRITICAL=$(node --input-type=module << 'EOF'
          import { readFileSync, existsSync } from 'fs';
          try {
            if (!existsSync('security-reports/npm-audit.json')) { console.log(0); process.exit(0); }
            const audit = JSON.parse(readFileSync('security-reports/npm-audit.json', 'utf8'));
            console.log(audit.metadata?.vulnerabilities?.critical ?? 0);
          } catch { console.log(0); }
          EOF
          )
          echo "Critical vulnerabilities found: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "❌ CRITICAL vulnerabilities detected — failing pipeline"
            exit 1
          fi
          echo "✅ No critical vulnerabilities — pipeline passes"
