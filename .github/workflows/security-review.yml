name: CareBridge Comprehensive Security Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security_review:
    name: Full Security Assessment (SAST + DAST + Deps + Reports)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      # ── PHASE 1+2: Backend Discovery ─────────────────────────────────────
      - name: Phase 1+2 — Backend Discovery & API Inventory
        run: node scripts/security-report.mjs discovery

      # ── PHASE 3: SAST ─────────────────────────────────────────────────────
      - name: Phase 3a — SAST via Semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/nodejsscan
            p/secrets

      - name: Phase 3b — SAST Custom Checks
        run: node scripts/security-report.mjs sast

      # ── PHASE 4: DAST (live API tests) ────────────────────────────────────
      - name: Start Backend API for DAST
        run: |
          node server/index.mjs &
          sleep 3
          curl -sf http://localhost:8787/api/health || echo "API not ready"

      - name: Phase 4 — DAST API Security Tests
        env:
          TEST_API_URL: "http://localhost:8787"
        run: node scripts/security-report.mjs api

      # ── PHASE 5: Dependency Scanning ──────────────────────────────────────
      - name: Phase 5a — npm Audit
        run: |
          npm audit --json > security-reports/npm-audit.json || true
          node scripts/security-report.mjs deps

      - name: Phase 5b — Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Phase 5c — Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: security-reports/trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM

      - name: Phase 5d — Trivy SARIF for GitHub Security Tab
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: security-reports/trivy-results.sarif

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: security-reports/trivy-results.sarif

      # ── PHASE 6+7+8: Report Generation ───────────────────────────────────
      - name: Phase 6+7+8 — Generate All Reports (MD + Excel)
        run: |
          node scripts/generate-security-reports.mjs
          node scripts/security-report.mjs summary

      # ── GitHub Actions Summary ─────────────────────────────────────────────
      - name: Publish Security Summary to GitHub Actions
        if: always()
        run: |
          echo "# 🛡️ CareBridge Security Assessment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run completed:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat security-reports/FULL_SUMMARY.md >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Reports Generated" >> $GITHUB_STEP_SUMMARY
          echo "- \`Vulnerability Test Results/security-review.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`Vulnerability Test Results/executive-summary.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`Vulnerability Test Results/dependency-report.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`Vulnerability Test Results/findings.xlsx\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`security-reports/npm-audit.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`security-reports/trivy-report.json\`" >> $GITHUB_STEP_SUMMARY

      # ── Upload all artifacts ───────────────────────────────────────────────
      - name: Upload Security Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carebridge-security-reports
          path: |
            Vulnerability Test Results/
            security-reports/

      # ── Fail ONLY on Critical ─────────────────────────────────────────────
      - name: Fail on Critical Vulnerabilities
        run: |
          CRITICAL=$(node -e "
            const fs = require('fs');
            try {
              const audit = JSON.parse(fs.readFileSync('security-reports/npm-audit.json', 'utf8'));
              console.log(audit.metadata?.vulnerabilities?.critical || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "Critical vulnerabilities found: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "❌ CRITICAL vulnerabilities detected — failing pipeline"
            exit 1
          fi
          echo "✅ No critical vulnerabilities — pipeline passes"
