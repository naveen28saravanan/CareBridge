name: CareBridge Grafana k6 Load Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  k6_load_test:
    name: Execute k6 Load Tests & Performance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Start Web Application & API Servers for Load Testing
        run: |
          npm ci
          npm run build
          node server/index.mjs &
          npx vite preview --host 0.0.0.0 --port 4173 &
          sleep 5

      - name: Run k6 Load Test Suite (Strict Threshold Verification)
        env:
          BASE_URL: "http://127.0.0.1:4173/"
          API_URL: "http://127.0.0.1:8787"
        run: |
          mkdir -p reports/k6
          k6 run --out json=reports/k6/summary.json load-tests/k6-suite.js

      - name: Generate k6 Summary HTML Report
        if: always()
        run: |
          npx -y k6-reporter reports/k6/summary.json --output reports/k6/report.html || true

      - name: Upload Load Testing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-reports
          path: |
            reports/k6/
