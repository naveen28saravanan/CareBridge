name: CareBridge React Native Appium Mobile E2E Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium_mobile_test:
    name: Execute Appium 2.x React Native Android Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create App Directory & Workspace Artifacts
        run: |
          mkdir -p app
          touch app/app-release.apk

      - name: Install Project Dependencies
        run: |
          npm ci || npm install

      - name: Execute Appium Mobile E2E Test Suite
        run: |
          npm run test:appium

      - name: Upload Mobile Automation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-reports
          path: |
            mochawesome-report/
            excel/
            reports/
